[pytest]
testpaths = tests
; 确定性基线默认排除真实层：pytest -m "not real_llm and not real_webdav"
; 真实 LLM 评测：CLARA_QA_REAL=1 pytest -m real_llm
; 真实 WebDAV A/B：CLARA_QA_WEBDAV=1 pytest -m real_webdav
markers =
    real_llm: 真实 LLM 评测（需 CLARA_QA_REAL=1，调用配置的真实端点，非确定性）
    real_webdav: 真实 WebDAV A/B 双实例同步（需 CLARA_QA_WEBDAV=1，外呼真实坚果云）
    perf: 性能基准（确定性层，毫秒级，默认随基线跑）
addopts = -m "not real_llm and not real_webdav"
