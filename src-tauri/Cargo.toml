[package]
name = "clara"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 钉 2.11 线：crate 须与 npm 侧 @tauri-apps/api（2.11.1）/ cli（2.11.4）同
# major.minor，否则 dev 启动报「version mismatched Tauri packages」警告。
# 必须用 ~（写 "2.11" 即 ^2.11，仍会解析到 2.12.5）。升 npm 依赖时同步放开。
tauri = { version = "~2.11", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
# 2.4 起硬要求 tauri ^2.12（与上面钉的 2.11 线互斥），故取 ~2.3（2.3.2 = tauri ^2.10）
tauri-plugin-global-shortcut = "~2.3"
# 主窗口几何防抖落盘的延时（tauri 本就是传递依赖，feature 合并零体积代价）
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
